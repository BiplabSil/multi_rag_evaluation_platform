name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Lint & Type Check ────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # ── Unit Tests ───────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: rag_eval
          MYSQL_USER: raguser
          MYSQL_PASSWORD: ragpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u raguser -pragpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        env:
          OPENAI_API_KEY: sk-fake
          MYSQL_HOST: localhost
          MYSQL_USER: raguser
          MYSQL_PASSWORD: ragpassword
          MYSQL_DATABASE: rag_eval
          QDRANT_URL: https://fake.cloud.qdrant.io
          QDRANT_API_KEY: fake-key
        run: python scripts/migrate.py

      - name: Run tests
        env:
          OPENAI_API_KEY: sk-fake
          MYSQL_HOST: localhost
          MYSQL_USER: raguser
          MYSQL_PASSWORD: ragpassword
          MYSQL_DATABASE: rag_eval
          QDRANT_URL: https://fake.cloud.qdrant.io
          QDRANT_API_KEY: fake-key
        run: pytest tests/ -v --tb=short

  # ── Docker Build ─────────────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t rag-eval-platform:${{ github.sha }} .

      - name: Run smoke test against container
        run: |
          docker run -d --name api-smoke \
            -e OPENAI_API_KEY=sk-fake \
            -e MYSQL_HOST=localhost \
            -e QDRANT_HOST=localhost \
            -p 8000:8000 \
            rag-eval-platform:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/health
          docker stop api-smoke
